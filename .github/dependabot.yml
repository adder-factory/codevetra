version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Toronto
    open-pull-requests-limit: 10
    groups:
      compatible-rust-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /verification/shuttle
    schedule:
      interval: weekly
      day: monday
      time: '06:15'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      compatible-shuttle-updates:
        patterns:
          - '*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: America/Toronto
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'
