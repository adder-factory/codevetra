[workspace]
resolver = "3"
exclude = ["vendor/tree-sitter-026-compat"]
members = [
  "crates/codevetra-agent",
  "crates/codevetra-cli",
  "crates/codevetra-config",
  "crates/codevetra-db",
  "crates/codevetra-domain",
  "crates/codevetra-extract",
  "crates/codevetra-indexer",
  "crates/codevetra-llm",
  "crates/codevetra-mcp",
  "crates/codevetra-search",
  "crates/codevetra-scip",
]

[workspace.package]
version = "4.0.4"
edition = "2024"
rust-version = "1.99.1"
authors = ["Adder Factory"]
license = "MIT"
repository = "https://github.com/adder-factory/codevetra"

[workspace.dependencies]
dunce = "=1.0.5"
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }
arborium-bash = "=2.18.2"
arborium-c = "=2.18.2"
arborium-c-sharp = "=2.18.2"
arborium-clojure = "=2.18.2"
arborium-commonlisp = "=2.18.2"
arborium-cpp = "=2.18.2"
arborium-css = "=2.18.2"
arborium-dart = "=2.18.2"
arborium-elixir = "=2.18.2"
arborium-fish = "=2.18.2"
arborium-fsharp = "=2.18.2"
arborium-glsl = "=2.18.2"
arborium-graphql = "=2.18.2"
arborium-groovy = "=2.18.2"
arborium-haskell = "=2.18.2"
arborium-hcl = "=2.18.2"
arborium-hlsl = "=2.18.2"
arborium-html = "=2.18.2"
arborium-java = "=2.18.2"
arborium-jsdoc = "=2.18.2"
arborium-json = "=2.18.2"
arborium-julia = "=2.18.2"
arborium-kotlin = "=2.18.2"
arborium-lean = "=2.18.2"
arborium-lua = "=2.18.2"
arborium-nix = "=2.18.2"
arborium-objc = "=2.18.2"
arborium-php = "=2.18.2"
arborium-powershell = "=2.18.2"
arborium-r = "=2.18.2"
arborium-regex = "=2.18.2"
arborium-rescript = "=2.18.2"
arborium-ruby = "=2.18.2"
arborium-scala = "=2.18.2"
arborium-solidity = "=2.18.2"
arborium-sql = "=2.18.2"
arborium-swift = "=2.18.2"
arborium-vb = "=2.18.2"
arborium-verilog = "=2.18.2"
arborium-vhdl = "=2.18.2"
arborium-yaml = "=2.18.2"
blake3 = "1.8.7"
codevetra-agent = { path = "crates/codevetra-agent" }
codevetra-cli = { path = "crates/codevetra-cli" }
codevetra-config = { path = "crates/codevetra-config" }
codevetra-db = { path = "crates/codevetra-db" }
codevetra-domain = { path = "crates/codevetra-domain" }
codevetra-extract = { path = "crates/codevetra-extract" }
codevetra-indexer = { path = "crates/codevetra-indexer" }
codevetra-llm = { path = "crates/codevetra-llm" }
codevetra-mcp = { path = "crates/codevetra-mcp" }
codevetra-scip = { path = "crates/codevetra-scip" }
codevetra-search = { path = "crates/codevetra-search" }
clap = { version = "4.6.7", default-features = false, features = [
  "derive",
  "error-context",
  "help",
  "std",
  "string",
  "suggestions",
  "usage",
] }
getrandom = "0.4.3"
ignore = "0.4.34"
itoa = "=1.0.18"
jiff = { version = "=0.2.38", default-features = false, features = ["std"] }
libc = "0.2.191"
lz4_flex = { version = "=0.14.0", default-features = false, features = ["safe-encode", "safe-decode"] }
memchr = "=2.8.3"
notify = "=8.2.1"
num-traits = "=0.2.19"
futures-util = "=0.3.34"
globset = "0.4.21"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
regex = "1.13.1"
regex-syntax = "0.8.11"
# Native RocksDB 11.12.0; the published binding includes bindgen 0.73.
rocksdb = { package = "rust-rocksdb", version = "=0.54.0", default-features = false, features = ["bindgen-runtime", "lz4", "zstd", "multi-threaded-cf"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring"] }
rustix = { version = "=1.1.6", default-features = false, features = ["std", "process"] }
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.11.1"
signal-hook = { version = "0.4.6", default-features = false }
thiserror = "2.0.21"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = [
  "fs",
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml_edit = "=0.25.17"
tree-sitter = "=0.27.1"
tree-sitter-abap-sqry = "=33.0.1"
tree-sitter-ada = "=0.9.2"
tree-sitter-arkts = "=0.3.0"
tree-sitter-astro-next = "=0.1.1"
tree-sitter-cuda = "=0.21.2"
tree-sitter-embedded-template = "=0.25.0"
tree-sitter-go = "=0.25.0"
unicode-ident = "=1.0.27"
tree-sitter-javascript = "=0.25.0"
tree-sitter-luau = "=1.2.0"
tree-sitter-ocaml = "=0.26.0"
tree-sitter-pascal = "=0.10.2"
tree-sitter-prisma-io = "=1.6.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-sfapex = "=3.0.1"
tree-sitter-slang = "=0.3.1"
tree-sitter-typescript = "=0.23.2"
tree-sitter-wgsl-bevy = "=0.1.4"
url = "2.5.8"

[workspace.lints.rust]
warnings = { level = "deny", priority = -2 }
future_incompatible = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
missing_docs = "deny"
unused_crate_dependencies = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
overflow-checks = true
panic = "abort"
strip = "symbols"

# Runtime-neutral facade for the ABAP bindings; see vendor/README.md.
[patch.crates-io]
tree-sitter = { path = "vendor/tree-sitter-026-compat" }
